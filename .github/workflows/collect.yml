# 收录（核心仓库设计 37 第三节第 4 条）：照四份规则收各仓库最新的 Release，写 index.json、签名，和 stats.json（下载次数，
# 设计 54，不签名）一起发到 Pages。
# 每天一次；改了规则、手动触发也跑。names.toml 新占的编号由这里写回 main。
name: collect

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.toml", "miyu-rev", ".github/workflows/collect.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 照开跑那一刻的 main 收（不照触发那一刻的提交）：排在别的一趟后面的，前一趟写回的编号也在里面（2026-11-05 手动触发和推送触发的两趟撞过）。
      - uses: actions/checkout@v4
        with:
          ref: main
      # 收录程序取核心仓库的哪一版：照根目录的 miyu-rev，打包模板（pack.yml）不写 miyu-rev 时也照它，两边读清单的是同一版。
      - name: 核心的版本
        run: echo "MIYU_REV=$(tr -d '[:space:]' < miyu-rev)" >> "$GITHUB_ENV"
      - name: 收录程序的缓存
        id: tool
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/miyu-index
          key: miyu-index-${{ env.MIYU_REV }}
      - name: 编收录程序
        if: steps.tool.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          cargo +1.97.0 install --locked --git https://github.com/miyu-agent/miyu --rev "$MIYU_REV" miyu-source --bin miyu-index
      # 上一份 index.json、stats.json（核心仓库设计 54）：沿用每个包的上线时刻、问不成的下载次数，攒最近 8 天的下载次数算趋势。
      # 还没有的（404）从这一次算起；别的错（Pages 一时连不上）整趟不发，省得上线时刻全被冲成今天。
      - name: 取上一份
        run: |
          mkdir -p site
          for file in index.json stats.json; do
            code=$(curl -sSL --retry 3 -o "site/$file" -w '%{http_code}' "https://miyu-agent.github.io/packages/$file" || echo 000)
            case "$code" in
              200) echo "$file: last one fetched" ;;
              404) rm -f "site/$file"; echo "$file: none yet" ;;
              *) echo "::error::$file: HTTP $code"; exit 1 ;;
            esac
          done
      # --github：照各包仓库的全部发布数下载次数（令牌只从 secrets 取，miyu-index 只发给 API，不印出来）。
      - name: 收
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '```'
            miyu-index build . site --github
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 签名
        env:
          MIYU_INDEX_KEY: ${{ secrets.MIYU_INDEX_KEY }}
        run: |
          miyu-index sign site/index.json
          miyu-index verify site/index.json
      - name: 写回新占的编号
        run: |
          if ! git diff --quiet names.toml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "names: 收录新占的编号" names.toml
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
