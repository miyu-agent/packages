# 打包模板的自测：三种系统上把 tests/hello 打一遍，不传 Release。
name: pack-selftest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/pack.yml", ".github/workflows/pack-selftest.yml", "tests/**"]

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, macos-latest, windows-latest]
    uses: ./.github/workflows/pack.yml
    with:
      package: hello
      folder: tests/hello
      runs-on: ${{ matrix.runs-on }}
      upload: false
